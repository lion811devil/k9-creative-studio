<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <title>K9 Creative Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div>
    <strong>K9 Creative Studio</strong>
    <span>Versione 3.0 · semplice e funzionale</span>
  </div>
  <button id="installBtn" class="ghost hidden" type="button">Installa</button>
</header>

<main class="workspace">
  <section class="preview-area">
    <div class="preview-toolbar">
      <button id="prevTemplate" type="button" aria-label="Modello precedente">‹</button>
      <strong id="templateName">Hero fotografico</strong>
      <button id="nextTemplate" type="button" aria-label="Modello successivo">›</button>
    </div>
    <div class="canvas-shell">
      <canvas id="posterCanvas" width="1080" height="1350" aria-label="Anteprima locandina"></canvas>
    </div>
    <p class="hint">L'anteprima è identica all'esportazione. Foto, testi e loghi vengono adattati automaticamente.</p>
  </section>

  <section class="controls">
    <nav class="steps" aria-label="Passaggi">
      <button class="step active" data-panel="designPanel" type="button"><span>1</span> Grafica</button>
      <button class="step" data-panel="contentPanel" type="button"><span>2</span> Testi</button>
      <button class="step" data-panel="exportPanel" type="button"><span>3</span> Esporta</button>
    </nav>

    <div id="designPanel" class="panel active">
      <h2>Grafica</h2>
      <label>Formato
        <select id="format">
          <option value="square">Quadrato 1:1</option>
          <option value="portrait" selected>Verticale 4:5</option>
          <option value="story">Storia 9:16</option>
          <option value="landscape">Orizzontale 16:9</option>
          <option value="a4">A4 verticale</option>
        </select>
      </label>

      <label>Modello locandina
        <select id="template"></select>
      </label>

      <label>Palette
        <select id="palette"></select>
      </label>

      <div class="upload-grid">
        <label class="upload">Foto principale<input id="photoInput" type="file" accept="image/*"></label>
        <label class="upload">Logo principale<input id="logoInput" type="file" accept="image/*"></label>
        <label class="upload optional">Secondo logo<input id="logo2Input" type="file" accept="image/*"></label>
      </div>

      <div class="range-row">
        <label>Inquadratura foto <input id="photoZoom" type="range" min="100" max="220" value="100"></label>
        <button id="resetPhoto" class="ghost" type="button">Centra foto</button>
      </div>
      <div class="photo-move">
        <button data-move="up" type="button">↑</button>
        <button data-move="left" type="button">←</button>
        <button data-move="center" type="button">•</button>
        <button data-move="right" type="button">→</button>
        <button data-move="down" type="button">↓</button>
      </div>
    </div>

    <div id="contentPanel" class="panel">
      <h2>Testi</h2>
      <label>Titolo
        <textarea id="title" rows="2" maxlength="90">DOGSITTER PROFESSIONALE</textarea>
      </label>
      <label>Sottotitolo
        <textarea id="subtitle" rows="2" maxlength="140">Cura, gestione e benessere del cane</textarea>
      </label>
      <label>Descrizione
        <textarea id="description" rows="4" maxlength="420">Passeggiate, compagnia e cura a domicilio. Aggiornamenti e foto durante il servizio.</textarea>
      </label>
      <div class="two-cols">
        <label>Intestazione informazioni
          <input id="infoHeading" type="text" maxlength="45" value="SERVIZI">
        </label>
        <label>Contatto
          <input id="contact" type="text" maxlength="90" value="393 467 6198">
        </label>
      </div>
      <label>Informazioni / elenco
        <textarea id="info" rows="5" maxlength="500">Passeggiate per cani
Cura a domicilio per cane e gatto
Pasti, acqua e attenzioni quotidiane
Disponibile a San Giuliano Milanese e zone limitrofe</textarea>
      </label>
      <div class="two-cols">
        <label>Testo pulsante
          <input id="cta" type="text" maxlength="35" value="CONTATTAMI">
        </label>
        <label>Firma / organizzazione
          <input id="brand" type="text" maxlength="70" value="K9 NAPOLETANO ACADEMY">
        </label>
      </div>
    </div>

    <div id="exportPanel" class="panel">
      <h2>Esporta</h2>
      <label>Nome progetto
        <input id="projectName" type="text" value="locandina-k9">
      </label>
      <div class="action-grid">
        <button id="saveProject" type="button">Salva progetto</button>
        <button id="loadProject" class="ghost" type="button">Apri ultimo</button>
        <button id="exportPng" class="primary" type="button">Scarica PNG</button>
        <button id="exportJpg" class="primary" type="button">Scarica JPG</button>
        <button id="exportPdf" class="primary wide" type="button">Scarica PDF</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </div>
  </section>
</main>
<script src="js/app.js" defer></script>
</body>
</html>
